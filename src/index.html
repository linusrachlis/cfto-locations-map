<!doctype html>
<html>

<head>
    <title>CFTO map demo</title>
    <meta charset=utf8>
    <meta name=viewport content="width=device-width; initial-scale=1">
    <style>
        @font-face {
            font-family: omnes-pro;
            src: url("https://use.typekit.net/af/09c03f/000000000000000077359bed/31/l?subset_id=2&fvd=n5&v=3") format("woff2"), url("https://use.typekit.net/af/09c03f/000000000000000077359bed/31/d?subset_id=2&fvd=n5&v=3") format("woff"), url("https://use.typekit.net/af/09c03f/000000000000000077359bed/31/a?subset_id=2&fvd=n5&v=3") format("opentype");
            font-style: normal;
            font-weight: 500;
            font-stretch: normal;
            font-display: auto;
        }

        @font-face {
            font-family: omnes-pro;
            src: url("https://use.typekit.net/af/829318/000000000000000077359c47/31/l?subset_id=2&fvd=n9&v=3") format("woff2"), url("https://use.typekit.net/af/829318/000000000000000077359c47/31/d?subset_id=2&fvd=n9&v=3") format("woff"), url("https://use.typekit.net/af/829318/000000000000000077359c47/31/a?subset_id=2&fvd=n9&v=3") format("opentype");
            font-style: normal;
            font-weight: 900;
            font-stretch: normal;
            font-display: auto;
        }

        body {
            font: 19px/30px omnes-pro, sans-serif;
            margin: 0;
            padding: 1em;
            background-color: hsla(339.71830986, 78.02197802%, 64.31372549%, 1);
        }

        h2 {
            font-family: omnes-pro, sans-serif;
            color: black;
            text-align: center;
            text-transform: uppercase;
            font-size: calc(20px + 3vw);
        }

        a {

            &:link,
            &:hover,
            &:active,
            &:visited {
                color: inherit;
                text-decoration: underline;
            }
        }
    </style>
</head>

<body>
    <h2>Community Fridge Locations</h2>

    <!-- BEGIN COPYING INTO SQUARESPACE EDITOR AFTER THIS LINE -->

    <div id="cfto-locations">
        <div id="cfto-locations-map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin defer></script>
    <script src="https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js"
        integrity="sha384-TqJpQ0URK8MzCC4s3ekivmwQmVfay3oiXhBt/Vl5nViiMrO7+rdFTc5VKDeUuto8" crossorigin defer></script>

    <script>
        (function () {
            // We use this weird technique of dynamically injecting page CSS to
            // avoid needing editing access to the site header, and to keep all
            // the map-related code together.

            // Base Leaflet CSS
            const leafletCss = document.createElement('link');
            leafletCss.rel = 'stylesheet';
            leafletCss.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            leafletCss.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
            leafletCss.crossOrigin = '';
            document.head.appendChild(leafletCss);

            // Leaflet Gesture Handling CSS (this is part of the "Leaflet
            // gesture handling" plugin that prevents the map from interfering
            // with scrolling the page)
            const gestureCss = document.createElement('link');
            gestureCss.rel = 'stylesheet';
            gestureCss.href = 'https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css';
            gestureCss.integrity = 'sha384-IKK988kZjVpx+y4Iqax/6yU7EVQx/sHewAKb/iqDCb9tCtgy25bGk5ZINDla9rgv';
            gestureCss.crossOrigin = '';
            document.head.appendChild(gestureCss);

            // Custom styles
            const customStyle = document.createElement('style');
            customStyle.textContent = `
                #cfto-locations {
                    #cfto-locations-map {
                        width: 100%;
                        height: 400px
                    }
                }

                @media (min-width: 901px) {
                    #cfto-locations {
                        #cfto-locations-map {
                            height: 625px;
                        }
                    }
                }
            `;
            document.head.appendChild(customStyle);
        })();

        document.addEventListener("DOMContentLoaded", function () {
            const sites = [
                {
                    lat: 43.6944722,
                    lng: -79.3084553,
                    addr: "250 Westlake Ave",
                    desc: "Outside Old's Cool General Store, to the left of the front door",
                },
                {
                    lat: 43.660949,
                    lng: -79.341213,
                    addr: "946 Queen St E",
                    desc: "North side of Queen St, 1 blocks west of Carlaw"
                },
                {
                    lat: 43.644165,
                    lng: -79.409591,
                    addr: "782 Adelaide St W",
                },
                {
                    lat: 43.646153,
                    lng: -79.4343061,
                    addr: "124 Brock Ave",
                },
                {
                    lat: 43.6548192,
                    lng: -79.4008324,
                    addr: "176 Baldwin St",
                },
                {
                    lat: 43.6683841,
                    lng: -79.4074487,
                    addr: "188 Lowther Ave",
                },
                {
                    lat: 43.6570309,
                    lng: -79.396296,
                    addr: "24 Cecil St",
                },
            ];


            const map = L.map(
                "cfto-locations-map",
                {
                    // Starting position and zoom for the map
                    center: [43.6684, -79.3726],
                    zoom: 13,
                    // Prevent the map from interfering with scrolling the page
                    // (see:
                    // https://github.com/elmarquis/Leaflet.GestureHandling/)
                    gestureHandling: true,
                    // Don't allow panning far away. This and the next
                    // option are to avoid using too much bandwidth from the
                    // tile provider.
                    maxBounds: [
                        [43.7733, -79.6612],
                        [43.5826, -79.0954],
                    ],
                    // Don't allow zooming out farther than this
                    minZoom: 12,
                }
            );


            if (window.location.host === "communityfridgesto.org") {
                // Use this tileLayer for the real website
                L.tileLayer('https://api.maptiler.com/maps/openstreetmap/{z}/{x}/{y}{r}.png?key={apiKey}', {
                    tileSize: 512,
                    zoomOffset: -1,
                    minZoom: 1,
                    attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
                    crossOrigin: true,
                    apiKey: 'zzjoWUuSE4Rdsd0oeLgi',
                }).addTo(map);
            } else {
                // Use this tileLayer for local testing to save on MapTiler API request quota
                L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);

                // Give access to the map object in the browser console for
                // testing/debugging
                window.leafletMap = map;
            }

            // Fix unreliable image path detection leading to broken marker
            // images. Leaflet uses very strange heuristics to auto-detect the
            // image path if this is not set explicitly, and they only work if
            // Leaflet CSS has finished loading by the time markers are being
            // added. We're probably more prone to this problem due to the way the
            // Leaflet CSS is injected into the header via this script, and
            // therefore starts loading later than if it were included in page's
            // original header.
            //
            // This hard-coded value was derived from comparing image URL when
            // it's working vs. not working.
            //
            // Root issue - see: https://github.com/Leaflet/Leaflet/issues/7202
            // Solution - see: https://leafletjs.com/reference.html#icon-default
            L.Icon.Default.prototype.options.imagePath = "https://unpkg.com/leaflet@1.9.4/dist/images/";

            for (let site of sites) {
                const marker = L.marker(
                    [site.lat, site.lng],
                    {"alt": `Map marker: ${site.addr}`}
                );
                marker.addTo(map);

                const popupContent = site.desc ? `<strong>${site.addr}</strong><br>${site.desc}` : `<strong>${site.addr}</strong>`;
                marker.bindPopup(popupContent);
            }
        });
    </script>

    <!-- STOP COPYING HERE -->

</body>

</html>
